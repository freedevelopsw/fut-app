spring.application.name=futapp
spring.profiles.default=dev

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Sessao persistente ("remember-me"): o utilizador nao volta a fazer login durante este periodo
futapp.remember-me.key=${FUTAPP_REMEMBER_KEY:mudar-esta-chave-em-producao}
futapp.remember-me.dias=30

# Admin criado no arranque, se ainda nao existir nenhum utilizador com a role ADMIN.
# Sem password definida, e gerada uma aleatoria e escrita no log do arranque.
futapp.admin.username=${FUTAPP_ADMIN_USERNAME:admin}
futapp.admin.nome=${FUTAPP_ADMIN_NOME:Administrador}
futapp.admin.password=${FUTAPP_ADMIN_PASSWORD:}

# Links de convite para registo: token encriptado com a data de expiracao (nada fica guardado na base de dados)
futapp.convite.chave=${FUTAPP_CONVITE_KEY:mudar-esta-chave-em-producao}
futapp.convite.validade-max-dias=7

# Links para redefinir a password (gerados pelo Admin na carta do jogador): validade em horas, servem uma so vez
futapp.password.link-validade-horas=24

# Auditoria: eventos mais antigos que isto sao apagados todos os dias as 4h e no arranque
futapp.audit.retencao-dias=90
futapp.audit.limpeza-cron=0 0 4 * * *
