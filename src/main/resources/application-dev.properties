# Desenvolvimento: base de dados H2 em ficheiro (os dados ficam entre arranques)
spring.datasource.url=jdbc:h2:file:./data/futapp;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.thymeleaf.cache=false

# Password do admin criado no arranque (so em desenvolvimento)
futapp.admin.password=${FUTAPP_ADMIN_PASSWORD:admin123}

# Em desenvolvimento, sem cache dos ficheiros estaticos: cada alteracao ao css/js aparece logo
spring.web.resources.chain.cache=false
spring.web.resources.cache.cachecontrol.max-age=0
spring.web.resources.cache.cachecontrol.cache-public=false
spring.web.resources.cache.cachecontrol.no-store=true

