<!DOCTYPE html>
<html lang="pt-PT" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mudar password')}"></head>
<body hx-boost="true">
<div class="app">
    <header class="app-header">
        <a th:href="@{/perfil}" class="etiqueta text-decoration-none">← Perfil</a>
        <h1 class="titulo">Mudar password</h1>
        <p class="m-0 small text-secondary">Depois de mudares, voltas a entrar com a nova password. Nos outros dispositivos também vais ter de entrar outra vez.</p>
    </header>

    <form th:action="@{/perfil/password}" th:object="${form}" method="post" class="d-flex flex-column flex-grow-1" novalidate>
        <main class="app-main">
            <input type="hidden" name="username" th:value="${eu.username()}" autocomplete="username">
            <div>
                <label class="form-label" for="atual">Password atual</label>
                <input class="form-control" type="password" id="atual" name="atual" th:classappend="${#fields.hasErrors('atual')} ? 'is-invalid'" autocomplete="current-password" required>
                <div class="invalid-feedback" th:errors="*{atual}"></div>
            </div>
            <div>
                <label class="form-label" for="nova">Nova password</label>
                <input class="form-control" type="password" id="nova" name="nova" th:classappend="${#fields.hasErrors('nova')} ? 'is-invalid'" autocomplete="new-password" minlength="6" required>
                <div class="invalid-feedback" th:errors="*{nova}"></div>
                <div class="form-text">Pelo menos 6 caracteres.</div>
            </div>
            <div>
                <label class="form-label" for="confirmacao">Repete a nova password</label>
                <input class="form-control" type="password" id="confirmacao" name="confirmacao" th:classappend="${#fields.hasErrors('confirmacao')} ? 'is-invalid'" autocomplete="new-password" required>
                <div class="invalid-feedback" th:errors="*{confirmacao}"></div>
            </div>
        </main>

        <div class="rodape">
            <div class="barra-acao">
                <button type="submit" class="btn btn-fa btn-verde">Mudar password</button>
            </div>
            <nav th:replace="~{fragments/layout :: nav}"></nav>
        </div>
    </form>
</div>
</body>
</html>
