<!DOCTYPE html>
<html lang="pt-PT" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Erro')}"></head>
<body>
<main class="ecra-entrada">
    <h1 class="titulo">Algo correu mal</h1>
    <p th:if="${erro}" class="m-0 text-secondary" th:text="${erro}">Mensagem</p>
    <p th:unless="${erro}" class="m-0 text-secondary" th:text="${status == 404} ? 'Esta página não existe.' : 'Tenta outra vez daqui a pouco.'">Tenta outra vez.</p>
    <a th:href="@{/}" class="btn btn-fa btn-verde">Voltar aos jogos</a>
</main>
</body>
</html>
