<!DOCTYPE html>
<html lang="pt-PT" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Nova password')}"></head>
<body>
<main class="ecra-entrada">
    <div class="d-flex flex-column gap-2">
        <h1 class="titulo">Nova password</h1>
        <p class="m-0 text-secondary" th:if="${nome}" th:text="|Olá ${nome}! Escolhe a tua nova password. Depois entras com ela.|">Olá! Escolhe a tua nova password.</p>
    </div>

    <div th:if="${linkErro}" class="aviso aviso-laranja" role="alert" th:text="${linkErro}">Este link expirou.</div>

    <form th:if="${form != null and linkErro == null}" th:action="@{/redefinir-password}" th:object="${form}" method="post" class="d-flex flex-column gap-3" novalidate>
        <input type="hidden" name="token" th:value="${token}">
        <div>
            <label class="form-label" for="nova">Nova password</label>
            <input class="form-control" type="password" id="nova" name="nova" th:classappend="${#fields.hasErrors('nova')} ? 'is-invalid'" autocomplete="new-password" minlength="6" required>
            <div class="invalid-feedback" th:errors="*{nova}"></div>
            <div class="form-text">Pelo menos 6 caracteres.</div>
        </div>
        <div>
            <label class="form-label" for="confirmacao">Repete a nova password</label>
            <input class="form-control" type="password" id="confirmacao" name="confirmacao" th:classappend="${#fields.hasErrors('confirmacao')} ? 'is-invalid'" autocomplete="new-password" required>
            <div class="invalid-feedback" th:errors="*{confirmacao}"></div>
        </div>
        <button type="submit" class="btn btn-fa btn-verde">Guardar nova password</button>
    </form>

    <p class="m-0 text-center"><a th:href="@{/login}">Voltar ao login</a></p>
</main>
</body>
</html>
