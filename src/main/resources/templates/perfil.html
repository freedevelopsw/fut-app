<!DOCTYPE html>
<html lang="pt-PT" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Perfil')}"></head>
<body hx-boost="true">
<div class="app">
    <header class="app-header">
        <div class="d-flex justify-content-between align-items-center gap-2">
            <p class="etiqueta">Perfil</p>
            <div class="d-flex flex-wrap gap-2">
                <span class="tag" th:if="${eu.gestor() and !eu.admin()}">Organizador</span>
                <span class="tag" th:if="${eu.admin()}">Admin</span>
            </div>
        </div>
    </header>

    <main class="app-main">
        <div th:replace="~{fragments/layout :: mensagens}"></div>

        <section th:replace="~{fragments/carta :: carta(${carta})}"></section>
        <a th:href="@{/perfil/dados}" class="btn btn-fa btn-fa-sm"
           th:classappend="${carta.preenchida()} ? 'btn-contorno' : 'btn-verde'"
           th:text="${carta.preenchida()} ? 'Editar os meus dados' : 'Preencher a minha carta'">Editar os meus dados</a>

        <section class="seccao">
            <h2 class="etiqueta">Conta</h2>
            <ul class="lista">
                <li><span class="nome text-secondary py-3" th:text="|Utilizador: ${eu.username()}|">Utilizador</span></li>
                <li><a class="nome text-reset text-decoration-none py-3" th:href="@{/perfil/password}">Mudar password</a></li>
            </ul>
        </section>

        <section th:if="${eu.gestor()}" class="seccao">
            <h2 class="etiqueta">Organização</h2>
            <ul class="lista">
                <li><a class="nome text-reset text-decoration-none py-3" th:href="@{/gestao/premios}">Prémios</a></li>
            </ul>
        </section>

        <section th:if="${eu.admin()}" class="seccao">
            <h2 class="etiqueta">Administração</h2>
            <ul class="lista">
                <li><a class="nome text-reset text-decoration-none py-3" th:href="@{/admin/membros}">Membros</a></li>
                <li><a class="nome text-reset text-decoration-none py-3" th:href="@{/admin/convites}">Links de convite</a></li>
                <li><a class="nome text-reset text-decoration-none py-3" th:href="@{/admin/auditoria}">Auditoria</a></li>
            </ul>
        </section>

        <form th:action="@{/logout}" method="post" hx-boost="false">
            <button type="submit" class="btn btn-fa btn-fa-sm btn-contorno">Sair da conta</button>
        </form>
    </main>

    <div class="rodape">
        <nav th:replace="~{fragments/layout :: nav}"></nav>
    </div>
</div>
</body>
</html>
