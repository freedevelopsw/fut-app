<!DOCTYPE html>
<html lang="pt-PT" xmlns:th="http://www.thymeleaf.org">

<head th:fragment="head(titulo)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1C7148">
    <title th:text="${titulo} + ' · FutApp'">FutApp</title>
    <link rel="manifest" th:href="@{/manifest.webmanifest}">
    <link rel="icon" type="image/svg+xml" th:href="@{/img/icone.svg}">
    <link rel="apple-touch-icon" th:href="@{/img/icone.svg}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script th:src="@{/js/carregando.js}" defer></script>
</head>

<body>

<!-- Mensagens de sucesso e erro (flash attributes) -->
<div th:fragment="mensagens" th:remove="tag">
    <div th:if="${sucesso}" class="aviso aviso-verde" role="status">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><path d="M5 12l5 5L20 7"/></svg>
        <span th:text="${sucesso}">Feito.</span>
    </div>
    <div th:if="${erro}" class="aviso aviso-erro" role="alert">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex:none"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.5"/></svg>
        <span th:text="${erro}">Erro.</span>
    </div>
</div>

<!-- Navegação inferior -->
<nav th:fragment="nav" class="nav-inferior" aria-label="Navegação principal">
    <a th:href="@{/}" th:classappend="${nav == 'jogo'} ? 'ativo'" th:aria-current="${nav == 'jogo'} ? 'page'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7l4 3-1.5 5h-5L8 10z"/></svg>
        Jogos
    </a>
    <a th:href="@{/estatisticas}" th:classappend="${nav == 'estatisticas'} ? 'ativo'" th:aria-current="${nav == 'estatisticas'} ? 'page'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M2 20h20"/></svg>
        Estatísticas
    </a>
    <a th:href="@{/perfil}" th:classappend="${nav == 'perfil'} ? 'ativo'" th:aria-current="${nav == 'perfil'} ? 'page'">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>
        Perfil
    </a>
</nav>

</body>
</html>
