<!DOCTYPE html>
<html lang="pt-PT" xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Carta do jogador. Parâmetro: c = CartaView -->
<section th:fragment="carta(c)" class="carta" th:aria-label="|Carta de ${c.nomeVisivel()}|">
    <div class="carta-topo">
        <div class="carta-rating">
            <span class="valor" th:text="${c.rating()} ?: '–'">78</span>
            <span class="sigla" th:text="${c.posicaoSigla()} ?: '—'">MED</span>
        </div>
        <span class="carta-avatar" aria-hidden="true" th:text="${c.iniciais()}">RU</span>
        <div class="d-flex flex-column gap-1" style="min-width: 0">
            <h2 class="carta-nome" th:text="${c.nomeVisivel()}">Rui</h2>
            <span class="carta-sub" th:if="${c.alcunha() != null}" th:text="${c.nome()}">Rui Costa</span>
        </div>
    </div>

    <div class="carta-factos" th:if="${c.posicao() != null or c.pe() != null or c.bloqueado()}">
        <span class="carta-facto" th:if="${c.posicao()}" th:text="${c.posicao()}">Médio</span>
        <span class="carta-facto" th:if="${c.posicaoSecundaria()}" th:text="|também ${c.posicaoSecundaria()}|">também Defesa</span>
        <span class="carta-facto" th:if="${c.pe()}" th:text="|Pé ${c.pe()}|">Pé direito</span>
        <span class="carta-facto" th:if="${c.bloqueado()}">Bloqueado</span>
    </div>

    <ul class="carta-atributos" th:if="${c.rating() != null}">
        <li th:each="a : ${c.atributos()}">
            <span class="linha"><span th:text="${a.nome()}">Velocidade</span><span class="num" th:text="${a.valor()} ?: '–'">8</span></span>
            <span class="carta-barra" aria-hidden="true"><div th:style="|width: ${a.percentagem()}%|"></div></span>
        </li>
    </ul>

    <p class="carta-vazia" th:unless="${c.preenchida()}"
       th:text="${c.eu()} ? 'Ainda não preencheste a tua carta. Diz aos outros onde jogas e como te avalias.' : 'Este jogador ainda não preencheu a carta.'">Ainda sem caracterização.</p>
</section>

<!-- Avaliação dos colegas, com o mesmo aspeto da carta. Parâmetros: c = CartaView, a = CartaAvaliacoesView.
     Cada barra é a média dos colegas; a marca é a autoavaliação do jogador. -->
<section th:fragment="cartaColegas(c, a)" class="carta" th:aria-label="|Avaliação dos colegas a ${c.nomeVisivel()}|">
    <div class="carta-topo">
        <div class="carta-rating">
            <span class="valor" th:text="${a.ratingColegasTexto()}">7,3</span>
            <span class="sigla" th:text="${a.votosTexto()}">12 votos</span>
        </div>
        <span class="carta-avatar" aria-hidden="true" th:text="${c.iniciais()}">RU</span>
        <div class="d-flex flex-column gap-1" style="min-width: 0">
            <h2 class="carta-nome" th:text="${c.nomeVisivel()}">Rui</h2>
            <span class="carta-sub">Média dos colegas</span>
        </div>
    </div>

    <ul class="carta-atributos carta-atributos-colegas" th:if="${a.temVotos()}">
        <li th:each="l : ${a.atributos()}">
            <span class="linha">
                <span th:text="${l.nome()}">Velocidade</span>
                <span><span class="auto" th:text="|auto ${l.autoTexto()}|">auto 9</span><span class="num" th:text="${l.colegasTexto()}">7,5</span></span>
            </span>
            <span class="barra-com-marca" aria-hidden="true">
                <span class="carta-barra"><div th:style="|width: ${l.percentagemColegas()}%|"></div></span>
                <span th:if="${l.auto() != null}" class="marca" th:style="|left: ${l.percentagemAuto()}%|"></span>
            </span>
        </li>
    </ul>
    <p class="carta-legenda" th:if="${a.temVotos()}"><span class="marca-amostra" aria-hidden="true"></span>Marca: a autoavaliação</p>

    <p class="carta-vazia" th:unless="${a.temVotos()}">Ainda nenhum colega avaliou esta carta.</p>
</section>
</body>
</html>
