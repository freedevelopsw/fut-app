<!DOCTYPE html>
<html lang="pt-PT" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Link para mudar a password')}"></head>
<body hx-boost="true">
<div class="app">
    <header class="app-header">
        <a th:href="@{/jogadores/{id}(id=${jogadorId})}" class="etiqueta text-decoration-none" th:text="|← ${nome}|">← Rui</a>
        <h1 class="titulo">Link para mudar a password</h1>
        <p class="m-0 small text-secondary" th:text="|Envia este link só a ${nome}, em privado. Quem o abrir escolhe uma nova password para esta conta.|">Envia este link só ao jogador.</p>
    </header>

    <main class="app-main">
        <section class="cartao d-flex flex-column gap-3">
            <div>
                <div class="fw-semibold">Link pronto</div>
                <div class="small text-secondary" th:text="|Válido até ${validoAte} · só funciona uma vez|">Válido até…</div>
            </div>
            <label class="visually-hidden" for="link">Link para mudar a password</label>
            <input class="form-control small" id="link" th:value="${link}" readonly onclick="this.select()">
            <button type="button" class="btn btn-fa btn-fa-sm btn-contorno" th:data-link="${link}"
                    onclick="navigator.clipboard.writeText(this.dataset.link).then(() => { this.textContent = 'Copiado'; })">Copiar link</button>
            <a th:href="${whatsappUrl}" target="_blank" rel="noopener" hx-boost="false" class="btn btn-fa btn-fa-sm btn-verde">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
                Enviar no WhatsApp
            </a>
            <p class="m-0 small text-secondary">O link não fica guardado na app. Deixa de funcionar quando a password for mudada. Se o perderes, gera outro na carta do jogador.</p>
        </section>
    </main>

    <div class="rodape">
        <nav th:replace="~{fragments/layout :: nav}"></nav>
    </div>
</div>
</body>
</html>
