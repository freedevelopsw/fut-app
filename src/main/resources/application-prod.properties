# Base de dados de producao.
# Sem DATABASE_URL: H2 num ficheiro em /tmp. ATENCAO: no Cloud Run o disco nao e permanente, por isso os dados
# perdem-se quando a instancia se desliga (sem uso) ou quando sai uma versao nova. Serve para experimentar.
# Com DATABASE_URL: PostgreSQL. Aceita o link do Neon tal como aparece
# (postgresql://utilizador:password@servidor/base?sslmode=require) ou um URL JDBC com DATABASE_USERNAME e DATABASE_PASSWORD.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:/tmp/futapp/futapp}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# Poucas ligacoes e fechadas depressa: a base de dados pode adormecer quando ninguem usa a app
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000

# Porta dada pelo alojamento (o Cloud Run usa a variavel PORT)
server.port=${PORT:8080}
# Atras do proxy HTTPS do alojamento: os links gerados (convites, password) ficam em https
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
