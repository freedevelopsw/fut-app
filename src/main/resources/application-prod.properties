# Base de dados de producao.
# Sem DATABASE_URL: H2 num ficheiro na pasta FUTAPP_DADOS (por omissao /tmp/futapp).
#   No Cloud Run, /tmp nao e permanente: os dados perdem-se quando a instancia se desliga ou sai uma versao nova.
#   Para os guardar, FUTAPP_DADOS deve apontar para um volume montado (por exemplo um bucket do Cloud Storage em /dados).
#   FILE_LOCK=NO: sem ficheiro de bloqueio (corre no maximo uma instancia); TRACE_LEVEL_FILE=0: sem ficheiro de trace.
# Com DATABASE_URL: PostgreSQL. Aceita o link do Neon tal como aparece
# (postgresql://utilizador:password@servidor/base?sslmode=require) ou um URL JDBC com DATABASE_USERNAME e DATABASE_PASSWORD.
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:${FUTAPP_DADOS:/tmp/futapp}/futapp;FILE_LOCK=NO;TRACE_LEVEL_FILE=0}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}

# Poucas ligacoes e fechadas depressa: a base de dados pode adormecer quando ninguem usa a app
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000

# Porta dada pelo alojamento (o Cloud Run usa a variavel PORT)
server.port=${PORT:8080}
# Atras do proxy HTTPS do alojamento: os links gerados (convites, password) ficam em https
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
