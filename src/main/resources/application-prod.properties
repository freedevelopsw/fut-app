# Base de dados de producao: sempre PostgreSQL, indicado em DATABASE_URL (obrigatoria, sem valor por omissao).
# Sem DATABASE_URL a app nao arranca (e o Cloud Run continua a servir a revisao anterior): nunca ha uma base de dados
# vazia de reserva. Aceita o link do Neon tal como aparece (postgresql://utilizador:password@servidor/base?sslmode=require)
# ou um URL JDBC com DATABASE_USERNAME e DATABASE_PASSWORD. O H2 nem sequer vai no jar de producao (scope test no pom).
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME:}
spring.datasource.password=${DATABASE_PASSWORD:}

# Poucas ligacoes e fechadas depressa: a base de dados pode adormecer quando ninguem usa a app
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000

# Porta dada pelo alojamento (o Cloud Run usa a variavel PORT)
server.port=${PORT:8080}
# Atras do proxy HTTPS do alojamento: os links gerados (convites, password) ficam em https
server.forward-headers-strategy=framework
server.servlet.session.cookie.secure=true
